<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pokémon Chronon">
<!-- A station clock reading 12:04. The minute hand, four minutes past, is the
     amber one: the drift is the story. Same grammar as the course marks:
     ink field, parchment glyph, one amber accent. -->
<rect width="64" height="64" rx="10" fill="#16213e"/>
<circle cx="32" cy="32" r="22" fill="none" stroke="#faf7f0" stroke-width="2.4"/>
<line x1="32" y1="12.5" x2="32" y2="16.5" stroke="#faf7f0" stroke-width="2.2" stroke-linecap="round"/>
<line x1="51.5" y1="32" x2="47.5" y2="32" stroke="#faf7f0" stroke-width="2.2" stroke-linecap="round"/>
<line x1="32" y1="51.5" x2="32" y2="47.5" stroke="#faf7f0" stroke-width="2.2" stroke-linecap="round"/>
<line x1="12.5" y1="32" x2="16.5" y2="32" stroke="#faf7f0" stroke-width="2.2" stroke-linecap="round"/>
<!-- hour hand: dead on twelve -->
<line x1="32" y1="32" x2="32.4" y2="21" stroke="#faf7f0" stroke-width="2.6" stroke-linecap="round"/>
<!-- minute hand: four minutes past, 24 degrees, amber -->
<line x1="32" y1="32" x2="38.9" y2="16.5" stroke="#c0851a" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="32" cy="32" r="2.2" fill="#c0851a"/>
</svg>
